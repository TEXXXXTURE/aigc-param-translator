<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="AIGC 调参翻译器 banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0F5FF"/>
      <stop offset="100%" stop-color="#E4EEFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="24" y="20" width="1152" height="260" rx="18" fill="#FFFFFF" stroke="#D6E4FF"/>
  <text x="600" y="104" text-anchor="middle" font-size="42" font-weight="700" fill="#1F2329" font-family="'PingFang SC','Microsoft YaHei',sans-serif">AIGC 调参翻译器</text>
  <text x="600" y="146" text-anchor="middle" font-size="18" fill="#646A73" font-family="'PingFang SC','Microsoft YaHei',sans-serif">把「我要这种感觉」翻译成「该这么调参数，以及为什么」</text>
  <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600">
    <rect x="120" y="188" width="150" height="46" rx="23" fill="#3B7CFF"/>
    <text x="195" y="217" text-anchor="middle" fill="#FFFFFF">需求</text>
    <text x="306" y="217" text-anchor="middle" fill="#3B7CFF" font-size="20">→</text>
    <rect x="332" y="188" width="190" height="46" rx="23" fill="#EAF1FF" stroke="#3B7CFF"/>
    <text x="427" y="217" text-anchor="middle" fill="#2B62D9">调参方案</text>
    <text x="558" y="217" text-anchor="middle" fill="#3B7CFF" font-size="20">→</text>
    <rect x="584" y="188" width="190" height="46" rx="23" fill="#EAF1FF" stroke="#3B7CFF"/>
    <text x="679" y="217" text-anchor="middle" fill="#2B62D9">参数解释</text>
    <text x="810" y="217" text-anchor="middle" fill="#3B7CFF" font-size="20">→</text>
    <rect x="836" y="188" width="190" height="46" rx="23" fill="#EAF1FF" stroke="#3B7CFF"/>
    <text x="931" y="217" text-anchor="middle" fill="#2B62D9">三路执行</text>
  </g>
  <text x="600" y="266" text-anchor="middle" font-size="13" fill="#8A9099" font-family="'PingFang SC','Microsoft YaHei',sans-serif">预设管易用 · 原子参数管可控 · 解释让人真正懂</text>
</svg>
